# CI/CD Pipeline with Security Scanning
include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Dependency-Scanning.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

stages:
  - test
  - security
  - build
  - monitor

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  BACKEND_IMAGE: $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA
  FRONTEND_IMAGE: $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA

#  TEST STAGE 

test:backend:
  stage: test
  image: python:3.11-slim
  script:
    - cd backend
    - pip install -r requirements.txt
    - python -m py_compile app.py
    - python -c "from services.gitlab_service import GitLabService"
    - python -c "from services.ai_service import AIService"
    - echo "✅ Backend tests passed"
  allow_failure: true

test:frontend:
  stage: test
  image: node:18-alpine
  script:
    - cd frontend
    - npm install
    - npm run build
    - echo "✅ Frontend build successful"
  allow_failure: true

# AI Auto-Review (Demonstrates Agentic Workflow)
ai:auto_review:
  stage: test
  image: python:3.11-slim
  script:
    - pip install requests
    - python scripts/ai_gitlab_bot.py
  only:
    - merge_requests
  allow_failure: true

#  SECURITY STAGE 

sast:
  stage: security
  allow_failure: true

dependency_scanning:
  stage: security
  allow_failure: true

secret_detection:
  stage: security
  allow_failure: true

#  BUILD STAGE 

build:backend:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - cd backend
    - docker build -t $BACKEND_IMAGE .
    - docker push $BACKEND_IMAGE
    - docker tag $BACKEND_IMAGE $CI_REGISTRY_IMAGE/backend:latest
    - docker push $CI_REGISTRY_IMAGE/backend:latest
    - echo "✅ Backend image pushed to GitLab Container Registry"
  only:
    - main
    - master
  allow_failure: true

build:frontend:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - cd frontend
    - docker build -t $FRONTEND_IMAGE .
    - docker push $FRONTEND_IMAGE
    - docker tag $FRONTEND_IMAGE $CI_REGISTRY_IMAGE/frontend:latest
    - docker push $CI_REGISTRY_IMAGE/frontend:latest
    - echo "✅ Frontend image pushed to GitLab Container Registry"
  only:
    - main
    - master
  allow_failure: true

#  MONITOR STAGE 

health_monitor:
  stage: monitor
  image: python:3.11-slim
  script:
    - pip install requests
    - python monitoring/health_check.py
  only:
    - main
    - master
  allow_failure: true