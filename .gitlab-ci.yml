# FINAL HACKATHON CI/CD PIPELINE

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Dependency-Scanning.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml
  - template: Security/Container-Scanning.gitlab-ci.yml
  - local: .gitlab/ci/environments.yml 

stages:
  - test        
  - security    
  - build       
  - monitor     
  - deploy      
  - release     

variables:
  DOCKER_DRIVER: overlay2
  BACKEND_IMAGE: $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA
  FRONTEND_IMAGE: $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA
  DOCKER_TLS_CERTDIR: "" 

# 1. TEST STAGE
test:backend:
  stage: test
  image: python:3.11-slim
  script:
    - cd backend
    - pip install -r requirements.txt
    - python -m py_compile app.py
    - python -c "from services.gitlab_service import GitLabService"
    - echo "Backend integrity checks passed"
  only:
    - main
    - master

ai:auto_review:
  stage: test 
  image: python:3.11-slim
  script:
    - pip install requests
    - python scripts/ai_gitlab_bot.py
  only:
    - merge_requests 
  allow_failure: true

# 2. SECURITY STAGE
sast:
  stage: security

dependency_scanning:
  stage: security

secret_detection:
  stage: security

container_scanning:
  stage: security
  needs: ["build:backend", "build:frontend"] 


# 3. BUILD STAGE 
build:backend:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -f backend/Dockerfile -t $BACKEND_IMAGE ./backend
    - docker push $BACKEND_IMAGE
    - docker tag $BACKEND_IMAGE $CI_REGISTRY_IMAGE/backend:latest
    - docker push $CI_REGISTRY_IMAGE/backend:latest
    - echo "Backend image pushed to registry"
  only:
    - main
    - master

build:frontend:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -f frontend/Dockerfile -t $FRONTEND_IMAGE ./frontend
    - docker push $FRONTEND_IMAGE
    - docker tag $FRONTEND_IMAGE $CI_REGISTRY_IMAGE/frontend:latest
    - docker push $CI_REGISTRY_IMAGE/frontend:latest
    - echo "Frontend image pushed to registry"
  only:
    - main
    - master


# 4. MONITOR STAGE
health_monitor:
  stage: monitor
  image: python:3.11-slim
  script:
    - pip install requests
    - python monitoring/health_check.py
  only:
    - main
    - master
  allow_failure: true


# 5. DEPLOY & RELEASE STAGES
deploy:production:
  stage: deploy
  image: alpine:latest
  extends: .production_settings 
  before_script:
    - apk add --no-cache curl
  script:
    - echo "Deployment trigger acknowledged. Verify status on Render dashboard."
  only:
    - main
    - master
  when: manual 

create_submission_release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  extends: .production_settings
  script:
    - echo "Creating release tag $CI_COMMIT_TAG"
  release:
    name: 'RepoInsight AI - Official Hackathon Submission'
    tag_name: 'v1.0.0-hackathon'
    description: 'Final submission demonstrating the full DevSecOps platform capability.'
    ref: $CI_COMMIT_SHA
    assets:
      links:
        - name: 'Live Demo URL'
          url: 'https://repoinsight-ai-frontend.onrender.com'
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual